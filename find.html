<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <meta content="">
    <style>
      #main {
        margin: auto;
        font-size: large;
        font-weight: bold;
        padding: 2em;
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.js"></script>
    <script>
      function ripUp () {
        for (var i = 1; i < 255; i++) {
          $( "#" + window.ipRange + i.toString()).remove();
        }
      }
      
      function portScan () {
        $('#message').text('Searching for TC... ');
        window.ipRange = window.myIp.replace(/[0-9]+$/, '');
        console.log('my IP: ', window.myIp, ', IP range: ', window.ipRange);
        window.found = false;
        for (var i = 1; i < 255; i++) {
          if (!window.found) {
            $('#progress').text(i.toString())
          }
          imgTest = $("<img/>")
            .on('load', function() {
              window.found = true;
              console.log("IMAGE LOADED FROM " + this.id);
              $('#message').html('FOUND! Your TC is at <a href="http://' + this.id + '">' + this.id + '</a>');
              $('#progress').text('')
              ripUp();
            })
            .on('error', function () {
              if (!window.found) {
                $('#progress').text(this.id)
              }
            })
            .attr("id", window.ipRange + i.toString())
            .attr("src", "http://" + window.ipRange + i.toString() + "/tc/elfinder-2.x/img/icons-big.png")
          ;
          setTimeout(function () {
            $(".id", window.ipRange + i.toString()).remove();
          }, 2000);
        }
      }
    
      window.RTCPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;//compatibility for Firefox and chrome
      var pc = new RTCPeerConnection({iceServers:[]}), noop = function(){};
      pc.createDataChannel('');//create a bogus data channel
      pc.createOffer(pc.setLocalDescription.bind(pc), noop);// create offer and set local description
      pc.onicecandidate = function(ice) {
        if (ice && ice.candidate && ice.candidate.candidate) {
          window.myIp = /([0-9]{1,3}(\.[0-9]{1,3}){3}|[a-f0-9]{1,4}(:[a-f0-9]{1,4}){7})/.exec(ice.candidate.candidate)[1];
          portScan();
          pc.onicecandidate = noop;
        }
      };
    </script>
  </head>
  <body>
    <div id="main">
      <span id="message"></span><span id="progress"></span>
    </div>
  </body>
</html>
