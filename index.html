<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- For bootstrap -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brahma Kumaris Traffic Control</title>
    <meta name="description" content="Brahma Kumaris online Traffic Control system">
    <meta name="keywords" content="Brahma Kumaris,Traffic Control,online" />
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- jQuery and jQuery UI -->
    <link rel="stylesheet" type="text/css" media="screen" href="jquery-ui-1.13.3/jquery-ui.css">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="jquery-ui-1.13.3/jquery-ui.min.js"></script>
    <script src="js/jquery-migrate-3.4.1.js"></script>
    
    <!-- Time zone handling -->
    <script src="js/moment.js"></script>
    <script src="js/moment-timezone-with-data.js"></script>
        
    <!-- elFinder CSS -->
    <link rel="stylesheet" type="text/css" media="screen" href="elFinder-2.1.65/css/elfinder.min.css">
    <link rel="stylesheet" type="text/css" media="screen" href="elFinder-2.1.65/css/theme.css">    
    
    <!-- elFinder JS -->
    <script src="elFinder-2.1.65/js/elfinder.full.js"></script>

    <!-- Time picker -->
    <script src="TimePicki/js/timepicki.js"></script>
    <link rel="stylesheet" type="text/css" media="screen" href="TimePicki/css/timepicki.css">    

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>
    
    <!-- Slider control -->
    <link rel="stylesheet" type="text/css" media="screen" href="css/bootstrap-slider.min.css?1">
    <script src="js/bootstrap-slider.min.js?1"></script>
    
    <!-- Toggle control -->
    <link rel="stylesheet" type="text/css" media="screen" href="css/bootstrap-toggle.min.css">
    <script src="js/bootstrap-toggle.min.js"></script>
    
    <!-- Local CSS -->
    <link rel="stylesheet" type="text/css" media="screen" href="css/tc-nojs.css">
    <script>
      document.write('<link rel="stylesheet" href="css/tc.css" />');
    </script>
    
    <!-- Local JS -->
    <script src="js/tc.js?1"></script>
    
    <!-- elFinder and time picker initialization -->
    <script>
      $().ready(function() {
        //Leave out elfinder if no PHP installed
        $.ajax({ url: 'php/tc.php?action=lan' }).done(function ( result ) {
          //Normally, the result should be 3 chars in length, either "wan" or "lan"
          if (result.length == 3) {
            //elFinder
            var myCommands = elFinder.prototype._options.commands,
              disabled = ['open'], elf,
              selectBind = function(event) {
                var selected = elf.selectedFiles(), path, hash, mime;
                  if (selected.length > 0) {
                    hash = selected[0].hash;
                    path = elf.path(hash);
                    mime = selected[0].mime;
                    TC.fileSelect(path, hash, mime);
                  }
                //return false
              };
            $.each(disabled, function(i, cmd) {
              (idx = $.inArray(cmd, myCommands)) !== -1 && myCommands.splice(idx,1);
            });
            elf = $('#elfinder').elfinder({
              url : 'elFinder-2.1.65/php/connector.php',  // connector URL (REQUIRED)
              // lang: 'ru',             // language (OPTIONAL)
              commands : myCommands
            }).elfinder('instance');
            //Bind elfinder select
            elf.bind('select', selectBind);
          }
        });
        TC.init();
      });
    </script>

    
  </head>
  <body role="document">
    <h1 class="titleBlock">Brahma Kumaris Traffic Control</h1>
    <div class="js">
      <form id="playListForm">
        <div class="container" id="topMenus">
          <!-- Audio player -->
          <div id="audioPlayerDiv" class="audioOntop container">
            <div class="row vertical-center">
              <audio id="audioPlayer" class="center-block" controls playStamp="init">
                An html5-capable browser is required to play this audio. 
              </audio>
            </div>
            <div id="nowPlayingTag" class="row nowPlayingDiv"></div>
          </div>

          <table class="table table-hover topTables">
            <tbody>
              <tr>
                <td class="topTables">
                  <div id="playListSelector">
                  </div>
                </td>
                <td class="topTables systemMode">
                  <table class="table table-hover table-condensed">
                    <tbody>
                      <tr id="playerMode">
                        <th class="tdCust modeTitle">
                          <span class="modeButton">
                            Mode
                          </span>
                        </th>    
                        <td class="tdCust modePreviewButtons">
                          <span class="btn btn-light modeButton" data-bs-toggle="tooltip" data-bs-placement="auto" data-bs-animation="true" title="Operate on remote system or in local browser">
                            <input id="modeToggleButton" type="checkbox" />
                          </span>
                        </td>
                          <th class="tdCust modeTitle">
                            <span class="previewButton">
                              Preview
                            </span>
                          </th>    
                          <td class="tdCust modePreviewButtons">
                            <span class="btn btn-light previewButton" data-bs-toggle="tooltip" data-bs-placement="auto" data-bs-animation="true" title="Preview music on remote system or in local browser">
                              <input id="previewToggleButton" type="checkbox" />
                            </span>
                          </td>
                      </tr>
                    </tbody>
                  </table>
              </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="container playListDiv" id="playList" >
        </div>
        
        <div class="container" id="elContainer"> 
        
          <!-- Element where elFinder will be created -->
          <div style="all: initial;">
            <div style="all: unset">
              <div id="elfinder"></div>
            </div>
          </div>
        </div>
      </form>
      <!-- Modals -->
      <div class="modal fade" id="editPlaylistName" tabindex="-1" aria-labelledby="playlistNameModalLabel" aria-hidden="true">
        <div class="modal-dialog playListModalWidth">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title" id="playlistNameModalLabel">Playlist Name</h4>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="playListNameForm"><input type="text" id="playListNameInput" name="playListNameInput" data-bs-toggle="tooltip" data-bs-placement="auto" data-bs-animation="true" title="Play list name"></form>
            </div>
            <div class="modal-footer">
              <button id="playListNameDone" type="button" class="btn btn-default" data-bs-dismiss="modal">OK</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal fade" id="confirmDeletePlaylist" tabindex="-1" aria-labelledby="playlistDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog playListModalWidth">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title" id="playlistDeleteModalLabel">Really delete playlist?</h4>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="playListDeleteName"></div>
            <div class="modal-footer">
              <button id="deleteListConfirm" type="button" class="btn btn-primary" data-bs-dismiss="modal">Delete</button>
              <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Required for audio player -->
      <!-- <script src="js/bootstrap3_player.js"></script> -->
    </div>
    <div class="nojs">
      <img src="img/screenshot.png">
    </div>
    <div class="about">
      <a href="more.html">More about the Traffic Control system</a>
    </div>
    
  </body>
</html>
