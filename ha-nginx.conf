server {
    listen 8099;
    root /var/www/html/trafficcontrol;
    index index.html index.php;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self';";

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # PHP_FPM_PASS is replaced at runtime: a TCP addr on Alpine
        # (127.0.0.1:9000) or unix:<socket> on Debian.
        fastcgi_pass PHP_FPM_PASS;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.tcsys {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }
}
