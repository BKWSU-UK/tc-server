version: '3.8'

services:
  php:
    build:
      context: ..
      dockerfile: test-rig/Dockerfile
    container_name: tc-php
    volumes:
      - ../:/var/www/html
      - php-socket:/run/php
    networks:
      - tc-network

  nginx:
    image: nginx:alpine
    container_name: tc-nginx
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - php-socket:/run/php
    depends_on:
      - php
    networks:
      - tc-network

volumes:
  php-socket:

networks:
  tc-network:
    driver: bridge
