version: '3.8'

services:
  php:
    build:
      context: ..
      dockerfile: test-rig/Dockerfile
      args:
        AUDIO_GID: ${AUDIO_GID:-29}
    container_name: tc-php
    devices:
      - /dev/snd:/dev/snd
    # Docker masks /proc/asound by default; getAudioDevices() reads it.
    security_opt:
      - systempaths=unconfined
    volumes:
      - ../:/var/www/html
      - php-socket:/run/php
      - tc-data:/var/www/html/.tcsys
    networks:
      - tc-network

  nginx:
    image: nginx:alpine
    container_name: tc-nginx
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - php-socket:/run/php
    depends_on:
      - php
    networks:
      - tc-network

volumes:
  php-socket:
  tc-data:

networks:
  tc-network:
    driver: bridge
