name: "Traffic Control"
description: "Audio scheduling and playback system for timed announcements and music"
version: "1.2.1"
slug: "trafficcontrol"
init: false

arch:
  - aarch64
  - amd64
  - armhf
  - armv7

startup: services

ingress: true
ingress_port: 8099
panel_icon: mdi:traffic-light

ports:
  8099/tcp: 8099

map:
  - media:rw

# /data is always available to add-ons automatically - no map entry needed.
# audio: true gives the add-on access to the host audio hardware via PulseAudio.
audio: true
