# Default: Alpine Linux base images (smaller footprint, Home Assistant default).
# The Dockerfile detects the package manager (apk/apt) and works on either family,
# so to build on Debian instead, swap the "*-base" images for "*-base-debian".
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base:latest"
  amd64: "ghcr.io/home-assistant/amd64-base:latest"
  armhf: "ghcr.io/home-assistant/armhf-base:latest"
  armv7: "ghcr.io/home-assistant/armv7-base:latest"
  i386: "ghcr.io/home-assistant/i386-base:latest"

# Debian/Ubuntu variant (uncomment and comment out the Alpine block above):
# build_from:
#   aarch64: "ghcr.io/home-assistant/aarch64-base-debian:latest"
#   amd64: "ghcr.io/home-assistant/amd64-base-debian:latest"
#   armhf: "ghcr.io/home-assistant/armhf-base-debian:latest"
#   armv7: "ghcr.io/home-assistant/armv7-base-debian:latest"
#   i386: "ghcr.io/home-assistant/i386-base-debian:latest"
